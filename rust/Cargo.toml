[package]
name = "rime_session"
version = "0.1.0"
edition = "2021"
description = "Rust session layer for 竹简 (zhujian-ime) Android IME"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "rime_session"

[dependencies]
# Planned:
# cxx = "1"           # or bindgen + librime C API
# thiserror = "1"
# serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1

# --- Android NDK notes (not cargo config; document for humans) ---
# Install targets:
#   rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
# Build with cargo-ndk (example):
#   cargo ndk -t arm64-v8a -t armeabi-v7a -o ../android/app/src/main/jniLibs \
#     build --release
# Link against prebuilt librime for each ABI; set ANDROID_NDK_HOME.
